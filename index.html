<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UP1 Jump & Run — Berlin Night</title>
  <style>
    :root {
      --bg: #05060d;
      --fg: #f6f7fb;
      --accent: #ff2c87;
      --enemy: #ff5c5c;
      --enemy2: #57e2ff;
      --wheel: #c3cad7;
      --up1: #ffe563;
      --panel: #0d1020;
      --border: #2a3352;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(900px 500px at 70% -5%, rgba(89,139,255,.2), transparent 60%),
        radial-gradient(700px 420px at 10% -10%, rgba(255,44,135,.2), transparent 62%),
        linear-gradient(180deg, #060919, var(--bg));
      color: var(--fg);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 12px;
    }
    .app {
      width: min(1000px, 100%);
      background: linear-gradient(180deg, rgba(14,18,34,.9), rgba(8,10,20,.85));
      border: 1px solid rgba(131,149,255,.25);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 25px 55px rgba(0,0,0,.5), inset 0 0 40px rgba(80,120,255,.05);
      backdrop-filter: blur(3px);
    }
    .head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0;
      font-size: clamp(20px, 3vw, 30px);
      letter-spacing: .02em;
      text-shadow: 0 0 20px rgba(87,226,255,.2);
    }
    .stats { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 14px; }
    .pill {
      border: 1px solid rgba(131,149,255,.3);
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(12,16,30,.7);
    }
    .pill strong { color: #fff; }
    canvas {
      width: 100%;
      height: auto;
      border-radius: 12px;
      border: 1px solid rgba(115,132,224,.35);
      background: linear-gradient(#121a36, #090b12 65%);
      display: block;
    }
    .controls {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      border: 1px solid rgba(131,149,255,.25);
      color: var(--fg);
      background: rgba(20,25,44,.72);
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      border-color: #a31b58;
    }
    .hint { margin: 10px 2px 4px; font-size: 13px; color: #d4d8ef; }
  </style>
</head>
<body>
  <div class="app">
    <div class="head">
      <h1>Jump & Run: DOWNTEMPO vs. UP1 — Berlin Nights</h1>
      <div class="stats">
        <span class="pill">Score: <strong id="score">0</strong></span>
        <span class="pill">Best: <strong id="best">0</strong></span>
        <span class="pill">Status: <strong id="status">Normal</strong></span>
        <span class="pill">Tempo: <strong id="tempo">1.0x</strong></span>
      </div>
    </div>

    <canvas id="game" width="960" height="500" aria-label="Jump and Run Spielfeld"></canvas>

    <div class="controls">
      <button id="start" class="primary">Start / Reset</button>
      <button id="pause">Pause</button>
    </div>
    <div class="hint">Steuerung: A/D oder ←/→ zum Laufen, W/↑/Leertaste zum Springen. Berlin-Style: Weiche <b>Pipetten</b>, <b>Felgen</b> & DOWNTEMPO-Monstern aus und sammle <b>UP1</b>-Boosts.</div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const statusEl = document.getElementById('status');
    const tempoEl = document.getElementById('tempo');

    const FLOOR = canvas.height - 72;
    const GRAVITY = 2000;
    const BERLIN_TOWERS = [
      { x: 90, w: 44, h: 190 }, { x: 168, w: 54, h: 160 }, { x: 244, w: 40, h: 210 },
      { x: 330, w: 60, h: 180 }, { x: 430, w: 55, h: 220 }, { x: 525, w: 38, h: 168 },
      { x: 600, w: 64, h: 210 }, { x: 705, w: 52, h: 176 }, { x: 794, w: 58, h: 230 },
      { x: 878, w: 44, h: 185 }
    ];

    const playerImg = new Image();
    playerImg.src = './1000085572_PhotoGrid.png';

    const state = {
      running: false,
      paused: false,
      score: 0,
      best: Number(localStorage.getItem('up1_best') || 0),
      player: {
        x: 130,
        y: FLOOR,
        w: 110,
        h: 220,
        vx: 0,
        vy: 0,
        jumps: 2,
        invUntil: 0,
      },
      obstacles: [],
      powerups: [],
      lastSpawn: 0,
      lastPower: 0,
      startTime: performance.now(),
      keys: new Set(),
    };

    bestEl.textContent = state.best;

    function difficulty(now) {
      const t = (now - state.startTime) / 1000;
      return 1 + Math.min(1.6, t * 0.02 + state.score * 0.01);
    }

    function reset() {
      state.score = 0;
      state.obstacles.length = 0;
      state.powerups.length = 0;
      state.player.x = 130;
      state.player.y = FLOOR;
      state.player.vx = 0;
      state.player.vy = 0;
      state.player.jumps = 2;
      state.player.invUntil = 0;
      state.lastSpawn = performance.now();
      state.lastPower = performance.now();
      state.startTime = performance.now();
      scoreEl.textContent = '0';
      statusEl.textContent = 'Normal';
      tempoEl.textContent = '1.0x';
    }

    function jump() {
      if (state.player.jumps > 0) {
        state.player.vy = -900;
        state.player.jumps -= 1;
      }
    }

    function spawnMonster(now) {
      const diff = difficulty(now);
      const kinds = ['DOWNTEMPO', 'PIPETTE', 'FELGE'];
      const kind = kinds[Math.floor(Math.random() * kinds.length)];
      const w = kind === 'FELGE' ? 72 : 66 + Math.random() * 58;
      const h = kind === 'FELGE' ? 72 : 48 + Math.random() * 68;
      state.obstacles.push({
        x: canvas.width + 40,
        y: FLOOR,
        w,
        h,
        speed: 300 * diff,
        name: kind,
        kind,
        spin: Math.random() * Math.PI * 2,
        color:
          kind === 'DOWNTEMPO'
            ? getComputedStyle(document.documentElement).getPropertyValue('--enemy')
            : kind === 'PIPETTE'
              ? getComputedStyle(document.documentElement).getPropertyValue('--enemy2')
              : getComputedStyle(document.documentElement).getPropertyValue('--wheel'),
      });
    }

    function spawnUP1(now) {
      const diff = difficulty(now);
      state.powerups.push({
        x: canvas.width + 24,
        y: FLOOR - (120 + Math.random() * 150),
        r: 18,
        speed: 260 * diff,
        pulse: 0,
      });
    }

    function overlaps(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y - a.h < b.y && a.y > b.y - b.h;
    }

    function circleRect(cir, rec) {
      const rx = rec.x;
      const ry = rec.y - rec.h;
      const nx = Math.max(rx, Math.min(cir.x, rx + rec.w));
      const ny = Math.max(ry, Math.min(cir.y, ry + rec.h));
      const dx = cir.x - nx;
      const dy = cir.y - ny;
      return dx * dx + dy * dy <= cir.r * cir.r;
    }

    function gameOver() {
      state.running = false;
      if (state.score > state.best) {
        state.best = state.score;
        localStorage.setItem('up1_best', String(state.best));
      }
      bestEl.textContent = state.best;
    }

    function update(dt, now) {
      const p = state.player;
      const diff = difficulty(now);
      const tempo = 1 + (diff - 1) * 0.55;
      tempoEl.textContent = `${tempo.toFixed(1)}x`;

      const accel = 1200;
      const maxV = 420;
      if (state.keys.has('ArrowLeft') || state.keys.has('KeyA')) p.vx = Math.max(-maxV, p.vx - accel * dt);
      else if (state.keys.has('ArrowRight') || state.keys.has('KeyD')) p.vx = Math.min(maxV, p.vx + accel * dt);
      else p.vx *= Math.pow(0.001, dt);

      p.x += p.vx * dt;
      p.x = Math.max(70, Math.min(canvas.width - 70, p.x));

      p.vy += GRAVITY * dt;
      p.y += p.vy * dt;
      if (p.y >= FLOOR) {
        p.y = FLOOR;
        p.vy = 0;
        p.jumps = 2;
      }

      const spawnEvery = 1100 / Math.min(1.9, diff);
      const powerEvery = 2900;

      if (now - state.lastSpawn > spawnEvery) {
        spawnMonster(now);
        state.lastSpawn = now;
      }
      if (now - state.lastPower > powerEvery) {
        spawnUP1(now);
        state.lastPower = now;
      }

      const playerHitbox = { x: p.x - p.w / 2 + 14, y: p.y - 6, w: p.w - 28, h: p.h - 20 };

      for (let i = state.obstacles.length - 1; i >= 0; i--) {
        const o = state.obstacles[i];
        o.x -= o.speed * dt;
        o.spin += dt * 4.5;
        if (o.x + o.w < -20) {
          state.obstacles.splice(i, 1);
          state.score += 1;
          scoreEl.textContent = state.score;
          continue;
        }
        if (overlaps(playerHitbox, o)) {
          if (now < p.invUntil) {
            state.obstacles.splice(i, 1);
            state.score += 2;
            scoreEl.textContent = state.score;
          } else {
            gameOver();
            return;
          }
        }
      }

      for (let i = state.powerups.length - 1; i >= 0; i--) {
        const up = state.powerups[i];
        up.x -= up.speed * dt;
        up.pulse += dt;
        if (up.x + up.r < 0) {
          state.powerups.splice(i, 1);
          continue;
        }
        if (circleRect({ x: up.x, y: up.y, r: up.r }, { x: playerHitbox.x, y: playerHitbox.y + playerHitbox.h, w: playerHitbox.w, h: playerHitbox.h })) {
          state.powerups.splice(i, 1);
          p.invUntil = now + 4500;
        }
      }

      statusEl.textContent = now < p.invUntil ? 'UP1 BOOST' : 'Normal';
    }

    function drawPlayer(p, now) {
      const inv = now < p.invUntil;
      if (inv) {
        const glow = ctx.createRadialGradient(p.x, p.y - p.h / 2, 10, p.x, p.y - p.h / 2, 120);
        glow.addColorStop(0, 'rgba(255, 229, 99, 0.6)');
        glow.addColorStop(1, 'rgba(255, 229, 99, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(p.x, p.y - p.h / 2, 120, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.drawImage(playerImg, p.x - p.w / 2, p.y - p.h, p.w, p.h);
    }

    function drawBerlinBackground(now) {
      const sky = ctx.createLinearGradient(0, 0, 0, FLOOR + 10);
      sky.addColorStop(0, '#111b3f');
      sky.addColorStop(0.45, '#0a1431');
      sky.addColorStop(1, '#06070f');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, FLOOR + 10);

      const moonX = 810;
      const moonY = 84;
      const moonGlow = ctx.createRadialGradient(moonX, moonY, 6, moonX, moonY, 72);
      moonGlow.addColorStop(0, 'rgba(255,245,206,0.82)');
      moonGlow.addColorStop(1, 'rgba(255,245,206,0)');
      ctx.fillStyle = moonGlow;
      ctx.beginPath();
      ctx.arc(moonX, moonY, 72, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#f6f0d2';
      ctx.beginPath();
      ctx.arc(moonX, moonY, 19, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.globalAlpha = 0.82;
      BERLIN_TOWERS.forEach((b, i) => {
        ctx.fillStyle = i % 2 ? '#131a33' : '#0f1730';
        ctx.fillRect(b.x, FLOOR - b.h, b.w, b.h);
        for (let wy = FLOOR - b.h + 12; wy < FLOOR - 10; wy += 17) {
          for (let wx = b.x + 8; wx < b.x + b.w - 6; wx += 11) {
            const seed = Math.sin((wx * 13.37) + (wy * 9.91) + i * 4.2);
            if (seed < 0.2) continue;
            ctx.fillStyle = seed > 0.75 ? 'rgba(255,226,150,.55)' : 'rgba(120,209,255,.45)';
            ctx.fillRect(wx, wy, 5, 7);
          }
        }
      });

      // TV Tower hint
      ctx.fillStyle = '#8fa2d6';
      ctx.fillRect(490, FLOOR - 250, 7, 250);
      ctx.beginPath();
      ctx.arc(493.5, FLOOR - 268, 18, 0, Math.PI * 2);
      ctx.fillStyle = '#a9b6de';
      ctx.fill();
      ctx.fillStyle = '#9bc8ff';
      ctx.fillRect(492, FLOOR - 305, 3, 35);
      ctx.restore();

      const haze = ctx.createLinearGradient(0, FLOOR - 120, 0, FLOOR + 8);
      haze.addColorStop(0, 'rgba(70,112,225,.12)');
      haze.addColorStop(1, 'rgba(8,10,15,.8)');
      ctx.fillStyle = haze;
      ctx.fillRect(0, FLOOR - 120, canvas.width, 128);

      ctx.fillStyle = '#101625';
      ctx.fillRect(0, FLOOR + 8, canvas.width, canvas.height - FLOOR);

      // Subtle moving light trails (city traffic vibe)
      for (let i = 0; i < 4; i++) {
        const offset = ((now * 0.05) + i * 140) % (canvas.width + 180);
        ctx.fillStyle = i % 2 ? 'rgba(255,83,133,.3)' : 'rgba(94,226,255,.26)';
        ctx.fillRect(canvas.width - offset, FLOOR + 32 + i * 7, 90, 2);
      }
    }

    function drawMonster(m) {
      const top = m.y - m.h;

      if (m.kind === 'PIPETTE') {
        ctx.fillStyle = '#9ff5ff';
        ctx.fillRect(m.x + m.w * 0.18, top, m.w * 0.36, m.h * 0.78);
        ctx.fillStyle = '#65d7ff';
        ctx.beginPath();
        ctx.moveTo(m.x + m.w * 0.36, top + m.h * 0.78);
        ctx.lineTo(m.x + m.w * 0.54, top + m.h * 0.78);
        ctx.lineTo(m.x + m.w * 0.45, top + m.h);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#e6fbff';
        ctx.fillRect(m.x + m.w * 0.25, top + 10, m.w * 0.07, m.h * 0.55);
      } else if (m.kind === 'FELGE') {
        const r = m.w * 0.5;
        const cx = m.x + r;
        const cy = top + r;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(m.spin);
        ctx.fillStyle = '#97a6be';
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#202635';
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.62, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#d3dded';
        ctx.lineWidth = 4;
        for (let s = 0; s < 6; s++) {
          ctx.rotate(Math.PI / 3);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(r * 0.8, 0);
          ctx.stroke();
        }
        ctx.restore();
      } else {
        const bodyGrad = ctx.createLinearGradient(m.x, top, m.x, m.y);
        bodyGrad.addColorStop(0, '#ff6d8e');
        bodyGrad.addColorStop(1, '#8f2846');
        ctx.fillStyle = bodyGrad;
        ctx.fillRect(m.x, top, m.w, m.h);
        ctx.fillStyle = '#111';
        ctx.fillRect(m.x + 5, top + 8, m.w - 10, 11);
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(m.x + m.w * 0.3, top + m.h * 0.45, 6, 0, Math.PI * 2);
        ctx.arc(m.x + m.w * 0.7, top + m.h * 0.45, 6, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 13px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(m.name, m.x + m.w / 2, top - 8);
    }

    function drawUP1(up) {
      const pulse = 1 + Math.sin(up.pulse * 8) * 0.15;
      const r = up.r * pulse;
      const g = ctx.createRadialGradient(up.x, up.y, 1, up.x, up.y, r * 2);
      g.addColorStop(0, 'rgba(255,229,99,0.8)');
      g.addColorStop(1, 'rgba(255,229,99,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(up.x, up.y, r * 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--up1');
      ctx.beginPath();
      ctx.arc(up.x, up.y, r, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#111';
      ctx.font = 'bold 13px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('UP1', up.x, up.y + 1);
    }

    function draw(now) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawBerlinBackground(now);

      const p = state.player;
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.ellipse(p.x, FLOOR + 18, 36, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      drawPlayer(p, now);
      state.obstacles.forEach(drawMonster);
      state.powerups.forEach(drawUP1);

      if (!state.running) {
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = '700 42px system-ui, sans-serif';
        ctx.fillText('GAME OVER', canvas.width / 2, 180);
        ctx.font = '600 22px system-ui, sans-serif';
        ctx.fillText(`Score: ${state.score}`, canvas.width / 2, 230);
        ctx.font = '500 16px system-ui, sans-serif';
        ctx.fillText('Start / Reset drücken für neue Runde', canvas.width / 2, 265);
      }
    }

    let last = performance.now();
    function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min((now - last) / 1000, 0.033);
      last = now;
      if (state.running && !state.paused) update(dt, now);
      draw(now);
    }

    document.addEventListener('keydown', (e) => {
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'Space', 'KeyA', 'KeyD', 'KeyW'].includes(e.code)) e.preventDefault();
      state.keys.add(e.code);
      if (['ArrowUp', 'Space', 'KeyW'].includes(e.code)) jump();
    });
    document.addEventListener('keyup', (e) => state.keys.delete(e.code));

    document.getElementById('start').addEventListener('click', () => {
      reset();
      state.running = true;
      state.paused = false;
    });
    document.getElementById('pause').addEventListener('click', () => {
      state.paused = !state.paused;
    });

    playerImg.addEventListener('load', () => draw(performance.now()));
    reset();
    draw(performance.now());
    requestAnimationFrame(loop);
  </script>
</body>
</html>
